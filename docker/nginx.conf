# 1. 提取客户端真实访问协议（优先取上一级反代协议，无则使用当前 scheme）
map $http_x_forwarded_proto $pnlcs_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 2. 从 Host 请求头中提取端口（例如 1.2.3.4:8090 提取出 8090，若无端口则默认 $server_port）
map $http_host $pnlcs_host_port {
    ~^.+:(?<p>\d+)$ $p;
    default         $server_port;
}

# 3. 提取最终有效端口（优先取上一级反代端口，无则取从 Host 提取的端口）
map $http_x_forwarded_port $pnlcs_forwarded_port {
    default $http_x_forwarded_port;
    ''      $pnlcs_host_port;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/pnlcs/public;

    # 禁用绝对重定向，优先使用相对重定向，防止端口映射或反向代理时丢失端口号
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;
    charset utf-8;

    # 允许上传较大文件（发票、工单附件、系统备份等）
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;

        # 传递真实主机名、端口与协议，确保 Laravel 的 redirect() 与 route() 正确识别公网端口与协议
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_PORT $pnlcs_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PORT $pnlcs_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $pnlcs_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

