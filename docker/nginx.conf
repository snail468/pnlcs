# 1. 提取客户端真实访问协议（优先取上一级反代协议，无则使用当前 scheme）
map $http_x_forwarded_proto $pnlcs_forwarded_proto {
    ~*https https;
    default $scheme;
}

# 2. 从 Host 请求头中提取端口（例如 1.2.3.4:8090 提取出 8090）
map $http_host $pnlcs_raw_host_port {
    ~^.+:(?<p>\d+)$ $p;
    default         '';
}

# 3. 提取初级端口（优先取上一级反代端口，其次取 Host 提取的端口）
map $http_x_forwarded_port $pnlcs_raw_port {
    default $http_x_forwarded_port;
    ''      $pnlcs_raw_host_port;
}

# 4. 纠正协议与端口：
# 如果协议是 https，端口绝不能为 80！若上级反代误传 80、或未传、或为 443，则强制设为 443；若带自定义非标端口（如 8443）则保留。
# 如果协议是 http，优先使用 Host 提取的端口（如 8090），否则默认 80。
map "$pnlcs_forwarded_proto:$pnlcs_raw_port" $pnlcs_forwarded_port {
    ~^https:(|80|443)$ 443;
    ~^https:(?<p>\d+)$ $p;
    ~^http:(?<p>\d+)$  $p;
    default            80;
}

# 5. HTTPS 标识判定
map $pnlcs_forwarded_proto $pnlcs_fastcgi_https {
    https   on;
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/pnlcs/public;

    # 禁用绝对重定向，优先使用相对重定向，防止端口映射或反向代理时丢失端口号
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;
    charset utf-8;

    # 允许上传较大文件（发票、工单附件、系统备份等）
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;

        # 传递真实主机名、端口与协议，确保 Laravel 的 redirect() 与 route() 正确识别公网端口与协议
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS $pnlcs_fastcgi_https if_not_empty;
        fastcgi_param SERVER_PORT $pnlcs_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PORT $pnlcs_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $pnlcs_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

